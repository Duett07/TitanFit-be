# Production profile configuration
app.seed.enabled=false
app.cookie.secure=true
app.cookie.same-site=Strict
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Tắt hoàn toàn Swagger/OpenAPI ở môi trường Production (chỉ bật khi có biến môi trường SPRINGDOC_ENABLED=true)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
