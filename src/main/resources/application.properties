spring.application.name=be
server.port=8080
spring.profiles.active=dev

# Load .env file automatically
spring.config.import=optional:file:.env[.properties],optional:file:be/.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/titanfit
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

## secret
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:2592000000}

## Initial accounts config
app.init.admin.email=${INIT_ADMIN_EMAIL}
app.init.admin.password=${INIT_ADMIN_PASSWORD}
app.init.buyer.email=${INIT_BUYER_EMAIL}
app.init.buyer.password=${INIT_BUYER_PASSWORD}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.packages-to-scan=com.app.be.controller
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false
