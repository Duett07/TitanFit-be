spring.application.name=be
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load .env file automatically
spring.config.import=optional:file:.env[.properties],optional:file:be/.env[.properties]

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/titanfit
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

## JWT Security & Token Expiration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_EXP:1800}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXP:604800}

## Cookie Security
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

## CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

## Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

## Seed data configuration (Default disabled)
app.seed.enabled=${APP_SEED_ENABLED:false}

## Initial accounts config
app.init.admin.email=${INIT_ADMIN_EMAIL:}
app.init.admin.password=${INIT_ADMIN_PASSWORD:}
app.init.admin.phone=${INIT_ADMIN_PHONE:0900000001}
app.init.buyer.email=${INIT_BUYER_EMAIL:}
app.init.buyer.password=${INIT_BUYER_PASSWORD:}
app.init.buyer.phone=${INIT_BUYER_PHONE:0912345678}

# Swagger / OpenAPI documentation (Default disabled for security)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.packages-to-scan=com.app.be.controller
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.override-with-generic-response=false
